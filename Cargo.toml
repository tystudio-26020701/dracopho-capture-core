[package]
name = "dracopho-capture-core"
version = "0.1.0"
edition = "2021"
description = "DracoPho 自研截屏核心（Rust）：PipeWire screencast / wlr-screencopy / X11 自研后端 + KWin ScreenShot2（KDE 窗口级），按桌面类型智能路由到最轻专用通道"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tystudio-26020701/dracopho-capture-core"

[lib]
name = "dracopho_capture_core"
path = "src/lib.rs"

[[bin]]
name = "dracopho-capture"
path = "src/bin/dracopho_capture.rs"

[dependencies]
pipewire = "0.8"
ashpd = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["composite", "randr", "xfixes", "dl-libxcb"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
